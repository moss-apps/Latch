name: Bug report
description: Something is broken in Latch
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Never include vault passwords, PINs, keys, or
        private media.** Redact logs before pasting.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: e.g. Pixel 8, Android 15
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: From Settings → About, or the APK filename.
    validations:
      required: false
  - type: dropdown
    id: install-source
    attributes:
      label: Install source
      options:
        - Google Play
        - GitHub release (APK)
        - Built from source
        - Not sure
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Unlock / auth
        - Import / vault
        - Gallery / viewer
        - Settings
        - Desktop backup (latchd)
        - Sync
        - Other / unknown
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Redact anything sensitive first.
      render: text
    validations:
      required: false
